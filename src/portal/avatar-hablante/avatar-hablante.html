<div class="ah-wrap"
     [class.ah-sm]="size === 'sm'"
     [class.ah-md]="size === 'md'"
     [class.ah-lg]="size === 'lg'"
     [class.ah-hablando]="voz.hablando()"
     [style.--ah-i]="intensidad()">

  <!-- Anillos expansivos dorados mientras habla -->
  <div class="ah-anillo ah-anillo-1" aria-hidden="true"></div>
  <div class="ah-anillo ah-anillo-2" aria-hidden="true"></div>

  <!-- Personaje en círculo con borde dorado (video si MP4, si no imagen) -->
  <div class="ah-foto">
    @if (esVideo) {
      <video #videoEl
             [src]="src"
             class="ah-img"
             loop
             muted
             playsinline
             preload="auto"
             aria-label="Dalia — asistente Mega Dulces">
      </video>
    } @else {
      <img [src]="src"
           alt="Dalia — asistente Mega Dulces"
           class="ah-img"
           loading="eager"
           decoding="async"
           referrerpolicy="no-referrer" />
    }
  </div>

  <!-- Burbuja con ondas de audio bajo la foto -->
  @if (voz.hablando()) {
    <div class="ah-burbuja" aria-hidden="true">
      <span class="ah-onda"></span>
      <span class="ah-onda"></span>
      <span class="ah-onda"></span>
      <span class="ah-onda"></span>
      <span class="ah-onda"></span>
    </div>
  }
</div>
