<div class="ah-wrap"
     [class.ah-sm]="size === 'sm'"
     [class.ah-md]="size === 'md'"
     [class.ah-lg]="size === 'lg'"
     [class.ah-hablando]="voz.hablando()">

  <!-- Anillos pulsantes mientras habla -->
  <div class="ah-anillo ah-anillo-1" aria-hidden="true"></div>
  <div class="ah-anillo ah-anillo-2" aria-hidden="true"></div>

  <!-- Pre-carga invisible para evitar parpadeos al cambiar sprite -->
  <img [src]="sprites.cerrada" class="ah-precarga" aria-hidden="true" alt="" />
  <img [src]="sprites.media" class="ah-precarga" aria-hidden="true" alt="" />
  <img [src]="sprites.abierta" class="ah-precarga" aria-hidden="true" alt="" />
  <img [src]="sprites.sonrisa" class="ah-precarga" aria-hidden="true" alt="" />

  <!-- Sprite actual del personaje -->
  <div class="ah-foto">
    <img [src]="sprites[estadoActual]" alt="Asistente Mega Dulces" class="ah-img" />
  </div>

  <!-- Burbuja con ondas de audio (solo mientras habla) -->
  @if (voz.hablando()) {
    <div class="ah-burbuja" aria-hidden="true">
      <span class="ah-onda"></span>
      <span class="ah-onda"></span>
      <span class="ah-onda"></span>
      <span class="ah-onda"></span>
    </div>
  }
</div>
