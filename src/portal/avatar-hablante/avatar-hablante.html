<div class="ah-wrap"
     [class.ah-sm]="size === 'sm'"
     [class.ah-md]="size === 'md'"
     [class.ah-lg]="size === 'lg'"
     [class.ah-hablando]="voz.hablando()">

  <!-- Anillos expansivos dorados mientras habla -->
  <div class="ah-anillo ah-anillo-1" aria-hidden="true"></div>
  <div class="ah-anillo ah-anillo-2" aria-hidden="true"></div>

  <!-- Foto en círculo con borde dorado -->
  <div class="ah-foto">
    <img [src]="src"
         alt="Dalia — asistente Mega Dulces"
         class="ah-img"
         loading="eager"
         decoding="async"
         referrerpolicy="no-referrer" />
  </div>

  <!-- Burbuja con ondas de audio bajo la foto -->
  @if (voz.hablando()) {
    <div class="ah-burbuja" aria-hidden="true">
      <span class="ah-onda"></span>
      <span class="ah-onda"></span>
      <span class="ah-onda"></span>
      <span class="ah-onda"></span>
      <span class="ah-onda"></span>
    </div>
  }
</div>
