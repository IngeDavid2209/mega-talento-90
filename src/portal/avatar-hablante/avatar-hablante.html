<div class="ah-wrap"
     [class.ah-sm]="size === 'sm'"
     [class.ah-md]="size === 'md'"
     [class.ah-lg]="size === 'lg'"
     [class.ah-hablando]="voz.hablando()">

  <!-- Anillos pulsantes mientras habla -->
  <div class="ah-anillo ah-anillo-1" aria-hidden="true"></div>
  <div class="ah-anillo ah-anillo-2" aria-hidden="true"></div>

  <!-- Marco circular con el personaje (video o GIF según el src) -->
  <div class="ah-foto">
    @if (esVideo) {
      <video [src]="src"
             class="ah-img"
             autoplay
             loop
             muted
             playsinline
             aria-label="Asistente Mega Dulces">
      </video>
    } @else {
      <img [src]="src" alt="Asistente Mega Dulces" class="ah-img" />
    }
  </div>

  <!-- Burbuja con ondas de audio (solo mientras habla) -->
  @if (voz.hablando()) {
    <div class="ah-burbuja" aria-hidden="true">
      <span class="ah-onda"></span>
      <span class="ah-onda"></span>
      <span class="ah-onda"></span>
      <span class="ah-onda"></span>
    </div>
  }
</div>
