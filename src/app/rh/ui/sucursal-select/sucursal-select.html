<!-- Todas las plazas a la vista. Un clic cambia de sucursal; el seleccionado
     lleva el pin dorado para que se distinga sin depender solo del color. -->
<div class="ss-chips" role="group" aria-label="Elegir sucursal">
  @for (o of opciones; track o.id) {
    <button type="button"
            class="ss-chip"
            [class.on]="o.id === value"
            [class.interno]="o.interno"
            [class.sin-reloj]="o.sinReloj"
            [attr.aria-pressed]="o.id === value"
            [title]="titulo(o)"
            (click)="elegir(o.id)">
      @if (o.id === value) {
        <svg class="ss-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
          <circle cx="12" cy="10" r="3"></circle>
        </svg>
      }
      <span>{{ o.etiqueta }}</span>
      @if (o.sinReloj) {
        <!-- Punto hueco: esta plaza está en la lista pero todavía no tiene reloj.
             Sin la marca, elegirla parece que el sistema se quedó en blanco. -->
        <span class="ss-sin-reloj-dot" aria-label="sin reloj checador"></span>
      }
    </button>
  }
</div>
