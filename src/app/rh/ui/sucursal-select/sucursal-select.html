<div class="ss" [class.abierto]="abierto">
  <!-- Botón/trigger -->
  <button type="button" class="ss-trigger" (click)="toggle()" [attr.aria-expanded]="abierto">
    <span class="ss-pin" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
        <circle cx="12" cy="10" r="3"></circle>
      </svg>
    </span>
    <span class="ss-label">{{ etiqueta }}</span>
    <svg class="ss-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6 9 12 15 18 9"></polyline>
    </svg>
  </button>

  <!-- Panel -->
  @if (abierto) {
    <div class="ss-panel" role="listbox">
      <div class="ss-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" [(ngModel)]="filtro" placeholder="Buscar sucursal…" autofocus
               (click)="$event.stopPropagation()"
               [ngModelOptions]="{ standalone: true }">
      </div>

      <div class="ss-list">
        @for (g of grupos; track g.titulo) {
          <div class="ss-grupo">{{ g.titulo }}</div>
          @for (it of g.items; track it.id) {
            <button type="button" class="ss-opt" [class.sel]="it.id === value" (click)="elegir(it.id)" role="option" [attr.aria-selected]="it.id === value">
              <span class="ss-opt-info">
                <span class="ss-opt-ciudad">{{ it.ciudad }}</span>
                @if (it.detalle) { <span class="ss-opt-detalle">{{ it.detalle }}</span> }
              </span>
              @if (it.id === value) {
                <svg class="ss-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
              }
            </button>
          }
        } @empty {
          <div class="ss-vacio">Sin coincidencias.</div>
        }
      </div>
    </div>
  }
</div>
