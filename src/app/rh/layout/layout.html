<div class="app-wrapper">

  <div class="menu-backdrop" [class.show]="isMenuOpen" (click)="isMenuOpen = false"></div>

  <header class="top-bar">
    <div class="left-section">
      <button class="hamburger-btn" (click)="toggleMenu()" aria-label="Abrir menú">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>

      <div class="brand-section">
        <img src="https://static.wixstatic.com/media/fd397e_0fd82a1ecec84a118ceeb603b493f25a~mv2.png"
             alt="Mega Dulces" class="app-logo-img">
        <div class="brand-text">
          <h1 class="app-title">Mega Talento</h1>
          <span class="app-subtitle">Sistema de Selección · Mega Dulces de Los Altos</span>
        </div>
      </div>
    </div>

    <div class="actions-section">
      <span class="env-badge">Producción</span>
    </div>
  </header>

  <nav class="side-drawer" [class.show]="isMenuOpen">
    <div class="drawer-header">
      <span class="drawer-title">Navegación</span>
      <button class="close-btn" (click)="isMenuOpen = false">✕</button>
    </div>

    <ul class="nav-list">
      <li (click)="isMenuOpen = false">
        <a routerLink="/app/dashboard" routerLinkActive="active">
          <span class="nav-icon">▣</span> Panel de control
        </a>
      </li>
      <li (click)="isMenuOpen = false">
        <a routerLink="/app/kanban" routerLinkActive="active">
          <span class="nav-icon">⊞</span> Embudo de talento
        </a>
      </li>
      <li (click)="isMenuOpen = false">
        <a routerLink="/app/historial" routerLinkActive="active">
          <span class="nav-icon">≡</span> Historial
        </a>
      </li>
      <li (click)="isMenuOpen = false">
        <a routerLink="/app/usuarios" routerLinkActive="active">
          <span class="nav-icon">◉</span> Gestión de usuarios
        </a>
      </li>
      <li (click)="isMenuOpen = false">
        <a routerLink="/unete" routerLinkActive="active">
          <span class="nav-icon">↗</span> Formulario público
        </a>
      </li>

      <li class="divider"></li>

      <li (click)="isMenuOpen = false">
        <a routerLink="/login" class="logout-link">
          <span class="nav-icon">⎋</span> Cerrar sesión
        </a>
      </li>
    </ul>

    <div class="drawer-footer">
      <small>Mega Dulces · {{ year }}</small>
    </div>
  </nav>

  <main class="content-area">
    <router-outlet></router-outlet>
  </main>

</div>
