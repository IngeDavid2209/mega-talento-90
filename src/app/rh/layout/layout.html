<div class="app-wrapper">

  <div class="menu-backdrop" [class.show]="isMenuOpen" (click)="isMenuOpen = false"></div>

  <header class="top-bar">
    <div class="left-section">
      <button class="hamburger-btn" (click)="toggleMenu()" aria-label="Abrir menú de navegación">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>

      <div class="brand-section">
        <img src="https://static.wixstatic.com/media/fd397e_0fd82a1ecec84a118ceeb603b493f25a~mv2.png"
          alt="Logo Mega Dulces" class="app-logo-img">
        <h1 class="app-title">MEGA TALENTO 90</h1>
      </div>
    </div>

    <div class="actions-section">
    </div>
  </header>

  <nav class="side-drawer" [class.show]="isMenuOpen">
    <div class="drawer-header">
      <span class="drawer-title">NAVEGACIÓN</span>
      <button class="close-btn" (click)="isMenuOpen = false">✕</button>
    </div>

    <ul class="nav-list">
      <li>
        <a routerLink="/app/dashboard" routerLinkActive="active" (click)="navegar('/app/dashboard')" style="display: block; width: 100%; padding-block: 8px;">Panel</a>
      </li>
      <li>
        <a routerLink="/app/kanban" routerLinkActive="active" (click)="navegar('/app/kanban')" style="display: block; width: 100%; padding-block: 8px;">Embudo de talento</a>
      </li>
      <li>
        <a routerLink="/app/usuarios" routerLinkActive="active" (click)="navegar('/app/usuarios')" style="display: block; width: 100%; padding-block: 8px;">Gestión de Usuarios</a>
      </li>
      <li>
        <a routerLink="/app/historial" routerLinkActive="active" (click)="navegar('/app/historial')" style="display: block; width: 100%; padding-block: 8px;">Historial</a>
      </li>
      <li>
        <a routerLink="/unete" routerLinkActive="active" (click)="navegar('/unete')" style="display: block; width: 100%; padding-block: 8px;">Ver Formulario público</a>
      </li>
      
      <li class="divider"></li>
      
      <li>
        <a (click)="navegar('/login')" class="logout-link" style="display: block; width: 100%; padding-block: 8px;">Salir</a>
      </li>
    </ul>
  </nav>

  <main class="content-area">
    <router-outlet></router-outlet>
  </main>

</div>
