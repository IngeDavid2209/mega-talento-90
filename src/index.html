<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Talento App</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
  <meta name="theme-color" content="#1A2F4E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" type="image/png" href="https://static.wixstatic.com/media/fd397e_0fd82a1ecec84a118ceeb603b493f25a~mv2.png">
</head>
<body>
  <!-- ¡Aquí es donde Angular va a inyectar tu formulario! -->
  <app-root></app-root>

  <!-- ══ ALTO REAL DE LA PANTALLA (fix del acceso directo en celular) ══
       El shell mide su alto con `100vh`. Al abrir la app desde el ACCESO
       DIRECTO del celular (modo standalone / web-clip), el navegador reporta
       mal ese `100vh` en el primer pintado: el layout sale descuadrado y solo
       se compone al refrescar a mano.
       Aquí se fija `--app-vh` con el alto REAL (window.innerHeight) al cargar,
       al rotar y CADA VEZ que se abre el acceso directo (`pageshow`, que
       dispara también al restaurar desde la caché de ida y vuelta). El CSS usa
       var(--app-vh) con respaldo a 100dvh/100vh, así el shell siempre nace con
       la medida correcta. Va inline para correr antes de que pinte Angular. -->
  <script>
    (function () {
      function alto() {
        document.documentElement.style.setProperty('--app-vh', window.innerHeight + 'px');
      }
      alto();
      addEventListener('resize', alto, { passive: true });
      addEventListener('orientationchange', alto, { passive: true });
      addEventListener('pageshow', alto);
    })();
  </script>
</body>
</html>
